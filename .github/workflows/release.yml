name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build registry
        run: node scripts/publish.mjs
      - name: Validate generated registry and artifacts
        run: node scripts/validate.mjs --no-sig --tolerate-network
      - name: Sign registry
        env:
          MARKET_PRIVATE_KEY: ${{ secrets.MARKET_PRIVATE_KEY }}
        run: node scripts/sign.mjs --key-env MARKET_PRIVATE_KEY
      - name: Verify signature
        run: node scripts/validate.mjs --pub keys/market-public.pem --skip-artifacts
      - name: Stage site
        run: |
          mkdir -p site
          cp registry.json registry.json.sig site/
          cp -r icons site/icons
          touch site/.nojekyll
      - name: Push site to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(pages): deploy registry (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
      - name: Verify deployed registry
        run: |
          base=https://sadami3066.github.io/SuperPI-Market
          for attempt in $(seq 1 30); do
            curl -fsSL "$base/registry.json" -o /tmp/live-registry.json || true
            curl -fsSL "$base/registry.json.sig" -o /tmp/live-registry.json.sig || true
            if cmp -s /tmp/live-registry.json registry.json; then
              break
            fi
            sleep 10
          done
          cmp /tmp/live-registry.json registry.json
          node scripts/validate.mjs --in /tmp/live-registry.json --sig /tmp/live-registry.json.sig --pub keys/market-public.pem --skip-artifacts
